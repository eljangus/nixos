    box_width = 592.0
    cx = 1280.0
    cy = 256.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.0

[notification]
background_opacity = 0.79999998211860657
monitors = [ "DP-1" ]

[osd]
background_opacity = 0.79999998211860657
monitors = [ "DP-1" ]

    [osd.kinds]
    media = false

[plugin_settings."avivbintangaringga/nix-monitor"]
branch = "nixos-unstable"
clean_command = "nh clean all"
panel_placement = "attached"

[plugin_settings."noctalia/wallhaven"]
browser_open_near_click = true
browser_placement = "attached"

[plugin_settings."oldirtty/color_picker"]
hyprpicker-lowercase = true
panel_open_near_click = true
panel_placement = "attached"

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/wallhaven", "avivbintangaringga/nix-monitor", "oldirtty/color_picker" ]

[shell]
avatar_path = "/home/elias/nixos/assets/misc/Alisa_Mikhailovna_Kujou_Manga.png"
button_borders = false
card_borders = false
clipboard_image_action_command = "swash"
corner_radius_scale = 2.0
font_family = "Maple Mono NF"
input_borders = false
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
popup_borders = false
screen_time_enabled = true

    [shell.animation]
    speed = 0.7500000111758709

    [shell.launcher]
    categories = false

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    clipboard_position = "auto"
    floating_offset = 12
    launcher_placement = "attached"
    launcher_position = "auto"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    polkit_placement = "attached"
    polkit_position = "auto"

    [shell.screenshot]
    directory = "~/Bilder/Bildschirmfotos"
    show_cursor = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Rosé Pine"
community_palette = "Rosey AMOLED"
custom_palette = "Paradise"
mode = "light"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "zen-browser", "discord", "vscode", "papirus-icons" ]

[wallpaper]
directory = "/home/elias/wallpapers/Walls"
transition = [ "disc", "fade", "wipe" ]

    [wallpaper.default]
    path = "/home/elias/wallpapers/Walls/IOS26-4.png"

    [wallpaper.last]
    path = "/home/elias/wallpapers/Walls/IOS26-4.png"

    [wallpaper.monitors.DP-1]
    path = "/home/elias/wallpapers/Walls/IOS26-4.png"

    [wallpaper.monitors.DP-2]
    path = "/home/elias/wallpapers/Walls/IOS26-4.png"

[widget.active_window]
display = "text_only"
font_weight = 700

[widget.clock]
format = " {:%H:%M Uhr - 󰃮 %a, %d.%m.%y}"
vertical_format = "\\\\n{:%H\\\\n%M\\\\n-\\\\n󰃮\\\\n%a\\\\n%d\\\\n%m\\\\n%y}"

[widget.custom-text]
color = "outline"
text = " |"
type = "text"

[widget.launcher]
custom_image = "/home/elias/nixos/assets/misc/nixos-logo.svg"
custom_image_colorize = true
font_weight = 700

[widget.mac-uhr]
color = "primary"
font_weight = 700
format = "{: %a, %b %d %H:%M}"
type = "clock"

[widget.nix-monitor]
checking_color = "secondary"
show_text = false
type = "avivbintangaringga/nix-monitor:nix-monitor"
up_to_date_color = "primary"
update_available_color = "tertiary"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.taskbar]
scale = 1.75
show_all_outputs = true

[widget.text_left]
text = "「"
type = "text"

[widget.text_left_custom]
text = "「 "
type = "text"

[widget.text_right]
text = "」"
type = "text"

[widget.text_seperator]
color = "outline"
text = "|"
type = "text"

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.weather]
show_condition = false

[widget.workspaces]
label_source = "name"
scroll_repeat = "steps"
style = "focus_hint"