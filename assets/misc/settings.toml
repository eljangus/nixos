    scale = 1.2000000104308128
    start = [ "launcher", "workspaces", "active_window" ]
    thickness = 40
    widget_spacing = 16

[brightness]
enable_ddcutil = true

[control_center]
hidden_tabs = [ "power" ]
sidebar_section = "none"
width = 800

[dock]
auto_hide = true
background_opacity = 0.79999998211860657
cross_axis_padding = 12
enabled = true
inactive_opacity = 0.99999997764825821
inactive_scale = 1.0
launcher_icon = "rocket"
margin_edge = 4
pinned = [
    "zen",
    "org.gnome.Nautilus",
    "Vesktop",
    "steam",
    "codium",
    "neovim",
    "prismlauncher",
    "chromium",
    "r2modman",
    "com.heroicgameslauncher.hgl"
]
radius = 40
reserve_space = false
show_dots = true
show_instance_count = false

[hot_corners.top_right]
action = "control_center"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 10

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.79999998211860657

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 1.0
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 8.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 229.0
    box_width = 810.0
    cx = 960.0
    cy = 958.5
    enabled = false
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 1.0
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
